name: host-contract-check

# Issue #2902 (Workstream I, slot I5): compare the #2526 guidance-carrier
# fixture's pinned converter shape against the REAL OpenCode host source at
# the version users actually install (npm-latest of @opencode-ai/plugin),
# independent of this repo's lockfile pin. Before this check existed, the only
# tripwires asserted the lockfile pin, so a host release that changed the
# converter structure landed silently (audit finding D4).
#
# Lanes:
#   - weekly schedule + workflow_dispatch: BLOCKING. On structural drift the
#     check step routes to a single deduplicated tracking issue
#     ("Host contract drift: message-v2.ts @ <tag>").
#   - pull_request (gated on host-contract surfaces): ADVISORY
#     (continue-on-error) — a PR cannot fix upstream drift, so it must never
#     block on it; the output is still visible in the log and job summary.

on:
  schedule:
    # Weekly, Monday 13:00 UTC — well inside the issue's "within a day" bar
    # for weekday host releases, while staying off the top-of-hour crunch.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Host tag to compare (empty = npm-latest of @opencode-ai/plugin)"
        required: false
        default: ""
  pull_request:
    branches: ["**"]
    paths:
      - "tests/helpers/host-*"
      - "tests/fixtures/host/**"
      - "scripts/check-host-contract.ts"
      - ".github/workflows/host-contract-check.yml"
      - "bun.lock"
      - "package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run host-contract check
        id: host_contract
        # Advisory on PRs (a PR cannot fix upstream drift); blocking on the
        # weekly schedule and manual dispatch. Routing to the tracking issue
        # runs in the same process (single-pass) and only on non-PR events.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # The dispatch input reaches the shell as an ENV VALUE, never as an
        # inline ${{ }} interpolation — env values are not shell-evaluated, so
        # a hostile or typo'd tag cannot inject commands (PRR-006).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          # ARGS only ever carries the constant --route-on-drift flag, so the
          # deliberate word-split below is over repo-controlled text.
          ARGS=""
          if [ "${{ github.event_name != 'pull_request' }}" = "true" ]; then
            ARGS="--route-on-drift"
          fi
          # shellcheck disable=SC2086 — ARGS is deliberately word-split
          if [ -n "$INPUT_TAG" ]; then
            bun scripts/check-host-contract.ts $ARGS --tag "$INPUT_TAG" 2>&1 | tee host-contract-output.txt
          else
            bun scripts/check-host-contract.ts $ARGS 2>&1 | tee host-contract-output.txt
          fi
          exit "${PIPESTATUS[0]}"
      - name: Record compared tag in job summary
        if: always()
        run: |
          {
            echo "## Host contract check"
            echo '```text'
            cat host-contract-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
