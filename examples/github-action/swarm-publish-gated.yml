name: Swarm gated issue publisher (example; copy and configure before enabling)

# This file is intentionally outside .github/workflows/. It is a reference
# caller, not an active workflow in opencode-swarm. Copy it into a consumer
# repository only after configuring the protected environment below.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: string

permissions: {}

concurrency:
  group: swarm-publish-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    # Only the configured label or an explicit dispatch can enter prepare.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'swarm-auto'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      artifact-path: .swarm/github-action/artifact.json
      run-key: ${{ steps.prepare-action.outputs.run-key }}
      artifact-digest: ${{ steps.prepare-action.outputs.artifact-digest }}
      issue-number: ${{ steps.issue-data.outputs.issue-number }}
      issue-title: ${{ steps.issue-data.outputs.issue-title }}
      issue-body: ${{ steps.issue-data.outputs.issue-body }}
      issue-url: ${{ steps.issue-data.outputs.issue-url }}
      base-branch: ${{ steps.issue-data.outputs.base-branch }}
      base-sha: ${{ steps.live-base.outputs.base-sha }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and validate trusted issue request
        id: issue-data
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          EVENT_LABELER: ${{ github.event.sender.login || '' }}
          DISPATCH_ACTOR: ${{ github.actor }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENT_REPOSITORY"
          if [[ "$EVENT_NAME" == "issues" ]]; then
            ISSUE_NUMBER="$EVENT_ISSUE_NUMBER"
            LABELER="$EVENT_LABELER"
            test "$EVENT_LABEL" = "swarm-auto"
          else
            ISSUE_NUMBER="$DISPATCH_ISSUE_NUMBER"
            LABELER="$DISPATCH_ACTOR"
          fi
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test -n "$LABELER"
          permission="$(gh api "repos/${EVENT_REPOSITORY}/collaborators/${LABELER}/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "requesting actor does not have write-level repository permission" >&2; exit 1 ;;
          esac
          repository_json="$(gh api "repos/${EVENT_REPOSITORY}")"
          base_branch="$(jq -r '.default_branch // empty' <<<"$repository_json")"
          [[ "$base_branch" =~ ^[A-Za-z0-9._/-]+$ && "$base_branch" != *'..'* ]]
          issue_json="$(gh api "repos/${EVENT_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          issue_title="$(jq -r '.title // empty' <<<"$issue_json")"
          issue_body="$(jq -r '.body // empty' <<<"$issue_json")"
          issue_url="$(jq -r '.html_url // empty' <<<"$issue_json")"
          canonical_issue_url="https://github.com/${EVENT_REPOSITORY}/issues/${ISSUE_NUMBER}"
          test "$issue_url" = "$canonical_issue_url"
          test -n "$issue_title"
          if [[ -z "$issue_body" ]]; then
            issue_body='[No issue body was provided.]'
          fi
          delimiter="SWARM_ISSUE_$(openssl rand -hex 16)"
          while [[ "$issue_title" == *"$delimiter"* || "$issue_body" == *"$delimiter"* ]]; do
            delimiter="SWARM_ISSUE_$(openssl rand -hex 16)"
          done
          {
            printf 'issue-number=%s\n' "$ISSUE_NUMBER"
            printf 'labeler=%s\n' "$LABELER"
            printf 'issue-url=%s\n' "$issue_url"
            printf 'base-branch=%s\n' "$base_branch"
            printf 'issue-title<<%s\n%s\n%s\n' "$delimiter" "$issue_title" "$delimiter"
            printf 'issue-body<<%s\nCanonical issue URL (identity only): %s\n<issue_text>\n%s\n</issue_text>\n%s\n' "$delimiter" "$issue_url" "$issue_body" "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Bind the live default branch revision
        id: live-base
        env:
          BASE_BRANCH: ${{ steps.issue-data.outputs.base-branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper='!gh auth git-credential' fetch --no-tags origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          live_base_sha="$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")"
          [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          git checkout --detach "$live_base_sha"
          test "$(git rev-parse HEAD)" = "$live_base_sha"
          printf 'base-sha=%s\n' "$live_base_sha" >> "$GITHUB_OUTPUT"

      - name: Verify pinned toolchain selections
        env:
          NODE_VERSION: ${{ vars.SWARM_NODE_VERSION }}
          BUN_VERSION: ${{ vars.SWARM_BUN_VERSION }}
          OPENCODE_VERSION: ${{ vars.SWARM_OPENCODE_VERSION }}
          SWARM_PLUGIN_REF: ${{ vars.SWARM_PLUGIN_REF }}
          ISSUE_TRACE: ${{ vars.SWARM_ISSUE_TRACE }}
        shell: bash
        run: |
          set -euo pipefail
          # The consumer owns the exact Node/Bun/OpenCode pins and Action/plugin
          # SHA. The Action bootstraps its own dependencies from its committed
          # bun.lock with --frozen-lockfile; no floating refs are permitted.
          test -n "$NODE_VERSION"
          test -n "$BUN_VERSION"
          test -n "$OPENCODE_VERSION"
          test -n "$SWARM_PLUGIN_REF"
          test -n "$ISSUE_TRACE"
          [[ "$SWARM_PLUGIN_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          command -v node >/dev/null
          test "$(node --version)" = "$NODE_VERSION"
          command -v bun >/dev/null
          test "$(bun --version)" = "$BUN_VERSION"
          command -v opencode >/dev/null
          test "$(opencode --version)" = "$OPENCODE_VERSION"

      - name: Prepare bounded artifact
        id: prepare-action
        uses: ZaxbyHub/opencode-swarm@REPLACE_WITH_40_CHAR_COMMIT_SHA # required: replace this sentinel before enabling
        with:
          mode: prepare
          repository: ${{ github.repository }}
          issue-number: ${{ steps.issue-data.outputs.issue-number }}
          issue-url: ${{ steps.issue-data.outputs.issue-url }}
          issue-title: ${{ steps.issue-data.outputs.issue-title }}
          issue-body: ${{ steps.issue-data.outputs.issue-body }}
          delivery-id: ${{ github.run_id }}-${{ github.run_attempt }}
          label: ${{ github.event.label.name || 'workflow_dispatch' }}
          labeler: ${{ steps.issue-data.outputs.labeler }}
          base-sha: ${{ steps.live-base.outputs.base-sha }}
          base-branch: ${{ steps.issue-data.outputs.base-branch }}
          deadline-ms: '1500000'
          model: ${{ vars.SWARM_MODEL || 'opencode/big-pickle' }}
          agent: architect
          # Optional provider declaration. Supply the matching value through
          # the job/step environment; it reaches only the OpenCode child.
          # provider-env: OPENAI_API_KEY
          opencode-version: ${{ vars.SWARM_OPENCODE_VERSION }}
          bun-version: ${{ vars.SWARM_BUN_VERSION }}
          plugin-ref: ${{ vars.SWARM_PLUGIN_REF }}
          artifact-path: .swarm/github-action/artifact.json
          expected-run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          expected-issue-trace: ${{ vars.SWARM_ISSUE_TRACE }}

      - name: Upload bound prepare artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: swarm-publish-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: .swarm/github-action/artifact.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep this fixed: dispatch input must not let a caller select an
    # unprotected Environment. Configure required reviewers on this exact name.
    environment: swarm-publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fresh checkout without persisted credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.prepare.outputs.base-sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Reject live-base drift before publication
        id: live-base-publish
        env:
          BASE_BRANCH: ${{ needs.prepare.outputs.base-branch }}
          PREPARE_BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
        shell: bash
        run: |
          set -euo pipefail
           git -c credential.helper='!gh auth git-credential' fetch --no-tags origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          live_base_sha="$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")"
          [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$live_base_sha" = "$PREPARE_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$PREPARE_BASE_SHA"
          printf 'base-sha=%s\n' "$live_base_sha" >> "$GITHUB_OUTPUT"

      - name: Download bound prepare artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: swarm-publish-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: .swarm/github-action

      - name: Publish verified artifact
        id: publish-action
        env:
          # This secret is configured on the protected `swarm-publish`
          # Environment and is unavailable until its reviewers approve.
          SWARM_ACTION_OVERSIGHT_STATUS: ${{ secrets.SWARM_ACTION_OVERSIGHT_STATUS }}
        uses: ZaxbyHub/opencode-swarm@REPLACE_WITH_40_CHAR_COMMIT_SHA # required: replace this sentinel before enabling
        with:
          mode: publish
          repository: ${{ github.repository }}
          issue-number: ${{ needs.prepare.outputs.issue-number }}
          issue-url: ${{ needs.prepare.outputs.issue-url }}
          issue-title: ${{ needs.prepare.outputs.issue-title }}
          issue-body: ${{ needs.prepare.outputs.issue-body }}
          delivery-id: ${{ github.run_id }}-${{ github.run_attempt }}
          base-sha: ${{ needs.prepare.outputs.base-sha }}
          expected-base-sha: ${{ steps.live-base-publish.outputs.base-sha }}
          base-branch: ${{ needs.prepare.outputs.base-branch }}
          opencode-version: ${{ vars.SWARM_OPENCODE_VERSION }}
          bun-version: ${{ vars.SWARM_BUN_VERSION }}
          plugin-ref: ${{ vars.SWARM_PLUGIN_REF }}
          artifact-path: .swarm/github-action/artifact.json
          artifact-digest: ${{ needs.prepare.outputs.artifact-digest }}
          expected-run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          expected-issue-trace: ${{ vars.SWARM_ISSUE_TRACE }}
          publication-token: ${{ github.token }}
