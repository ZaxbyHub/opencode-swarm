name: PR Standards

# Enforces the publication contract owned by the single source of truth at
# .claude/skills/commit-pr/SKILL.md. Keep allowed types and required sections in
# sync with that skill — it wins on any conflict.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: string
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Emit these required checks for merge-queue groups too, so the queue can merge
  # (see issue #1046). These jobs validate PR title/body, which do not exist for a
  # merge group, so on `merge_group` every step is skipped and the job reports
  # success — the PR already satisfied them before being queued.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

# Issue #3307: cancel a superseded pull_request run for the same PR (stale
# verdicts otherwise outlive the head they describe). merge_group and
# workflow_dispatch runs get run-unique groups and cancel-in-progress false —
# merge-queue required checks must never be cancelled mid-batch.
concurrency:
  group: pr-standards-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-title:
    runs-on: ubuntu-latest
    # Issue #3300: bound the job (its steps are one action + two short gh api
    # calls) so a hung network step cannot occupy a runner to the repository
    # default ceiling; mirrors the sibling pr-standards job's bound.
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types MUST match .claude/skills/commit-pr/SKILL.md (Step 1).
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            refactor
            test
            ci
            build
          requireScope: false

      - name: Validate dispatched PR title
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # Issue #3307: the dispatch input is an unvalidated string reaching
          # REST path interpolation below; refuse non-decimal values before
          # any gh api call.
          case "${PR_NUMBER}" in
            ''|*[!0-9]*)
              # Never reflect the raw input into the workflow command: a
              # multi-line dispatch value could forge extra annotation lines.
              # A length + character-class summary is enough to diagnose.
              echo "::error::pr_number input must be all decimal digits (received ${#PR_NUMBER} character(s) with non-decimal content)."
              exit 1
              ;;
          esac
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          title="$(jq -r '.title' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Dispatched PR head $head_sha does not match workflow ref $GITHUB_SHA."
            exit 1
          fi
          if ! grep -Eq '^(feat|fix|perf|revert|docs|chore|refactor|test|ci|build)(\([^)]+\))?!?: .+' <<< "$title"; then
            echo "::error::PR title does not satisfy the conventional-title contract."
            exit 1
          fi
          echo "Dispatched PR title contract satisfied for #$PR_NUMBER."

  pr-standards:
    runs-on: ubuntu-latest
    # Bound the job: a hung git fetch or classifier run must not hold a
    # runner to the default ceiling (issue #3290; cleanup-release-fragments
    # carries 70 for its wait budgets — this job has no waits, 15 is generous).
    timeout-minutes: 15
    steps:
      - name: Validate PR body contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Release-please and other bots do not follow the human PR body contract.
          case "$PR_AUTHOR" in
            *"[bot]"|"Copilot")
              echo "Bot author ($PR_AUTHOR) — skipping PR body contract."
              exit 0
              ;;
          esac

          body="${PR_BODY:-}"
          missing=0

          # Required sections must be present AND in this order, per commit-pr
          # SKILL Step 6. Match each heading on its own line and compare positions.
          summary_ln="$(grep -n -m1 '^## Summary[[:space:]]*$' <<< "$body" | cut -d: -f1 || true)"
          audit_ln="$(grep -n -m1 '^## Invariant audit[[:space:]]*$' <<< "$body" | cut -d: -f1 || true)"
          test_ln="$(grep -n -m1 '^## Test plan[[:space:]]*$' <<< "$body" | cut -d: -f1 || true)"

          for pair in "Summary:$summary_ln" "Invariant audit:$audit_ln" "Test plan:$test_ln"; do
            name="${pair%%:*}"; ln="${pair##*:}"
            if [ -z "$ln" ]; then
              echo "::error::PR body is missing required section: ## $name"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            if [ "$summary_ln" -ge "$audit_ln" ] || [ "$audit_ln" -ge "$test_ln" ]; then
              echo "::error::PR body sections must appear in order: ## Summary, then ## Invariant audit, then ## Test plan."
              missing=1
            fi
          fi

          # 'Closes #<n>' must be the FIRST body line when the PR resolves an
          # issue. It is conditional, so a miss is a warning, not a failure.
          if ! grep -Eq '^Closes #[0-9]+' <<< "$(head -n1 <<< "$body")"; then
            echo "::warning::First body line is not 'Closes #<issue-number>'. This is required when the PR resolves an issue."
          fi

          # Flag hollow test plans so reviewers confirm the omission is intentional.
          test_plan="$(awk '/## Test plan/{flag=1; next} /^## /{flag=0} flag' <<< "$body")"
          if grep -Eiq 'not run|to be determined|^[[:space:]]*tbd[[:space:]]*$|^[[:space:]]*n/?a[[:space:]]*$' <<< "$test_plan"; then
            echo "::warning::Test plan appears incomplete. Ensure any unvalidated items are explicitly justified under '## Test plan'."
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Fix the PR body per .claude/skills/commit-pr/SKILL.md (the single source of truth) before this check can pass."
            exit 1
          fi
          echo "PR body contract satisfied."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          # This job executes PR-head-controlled TypeScript (the classifier
          # below); do not leave the job token on disk for it to read
          # (issue #3290 — the workflow_dispatch checkout already did this).
          persist-credentials: false

      # Classifier runtime for both fragment-gate consumers below (issue
      # #2955). Conditioned off merge_group so the documented vacuous-success
      # queue contract above keeps holding with no network-dependent step.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        with:
          bun-version: "1.3.13"

      # The dispatched arm runs bun scripts against the repo; the sole
      # pull_request checkout above does not cover workflow_dispatch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false

      - name: Require pending release fragment
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          case "$PR_AUTHOR" in
            *"[bot]"|"Copilot")
              echo "Bot author ($PR_AUTHOR) — skipping release fragment requirement."
              exit 0
              ;;
          esac

          git fetch --no-tags --quiet origin "$BASE_REF"

          # Path classification is owned by scripts/user-visible-paths.ts
          # (issue #2955): changed/added lists go to the shared classifier,
          # which prints one verdict line and maps the exit code to gate
          # semantics (0 = no violation, 1 = violation, else unusable).
          # The lists travel NUL-framed through temp files (issue #3290):
          # `git diff -z` never C-quotes a name — quote, backslash, and
          # control characters stay verbatim — and a NUL delimiter survives
          # names containing newlines, so this arm agrees with the quality
          # gate's own `-z` view instead of a lossy line-delimited transport.
          tmp_changed="$(mktemp)"
          tmp_added="$(mktemp)"
          trap 'rm -f "${tmp_changed:-}" "${tmp_added:-}"' EXIT
          git diff --name-only --no-renames -z "origin/${BASE_REF}...HEAD" > "$tmp_changed"
          git diff --name-only --diff-filter=A --find-renames=100% -z "origin/${BASE_REF}...HEAD" > "$tmp_added"

          # No file changes -> nothing to gate.
          if [ ! -s "$tmp_changed" ]; then
            echo "No changed files detected; release fragment not required."
            exit 0
          fi

          rc=0
          verdict="$(bun scripts/check-pending-fragment.ts --print-requirement --paths-format nul --changed-file "$tmp_changed" --added-file "$tmp_added")" || rc=$?

          case "$rc" in
            0)
              case "$verdict" in
                *'required=false'*)
                  echo "Docs/workflow/meta-only change without release fragment accepted."
                  ;;
                *)
                  echo "Release fragment present:"
                  tr '\0' '\n' < "$tmp_added" | grep -E '^docs/releases/pending/.+\.md$' || true
                  ;;
              esac
              ;;
            1)
              # A bun crash also exits 1, so the verdict line decides whether
              # this is a real violation or an unusable classifier.
              case "$verdict" in
                'required=true satisfied=false')
                  echo "::error::Missing docs/releases/pending/<unique-slug>.md release fragment (see .claude/skills/commit-pr/SKILL.md Step 2)."
                  ;;
                *)
                  echo "::error::Fragment classifier failed (exit 1, no violation verdict): ${verdict:-<no output>}"
                  ;;
              esac
              exit 1
              ;;
            *)
              echo "::error::Fragment classifier unusable (exit $rc): $verdict"
              exit 1
              ;;
          esac

      - name: Validate dispatched PR contract
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # Issue #3307: same guard as the check-title dispatch step — refuse
          # a non-decimal pr_number before any gh api call.
          case "${PR_NUMBER}" in
            ''|*[!0-9]*)
              # Never reflect the raw input into the workflow command: a
              # multi-line dispatch value could forge extra annotation lines.
              # A length + character-class summary is enough to diagnose.
              echo "::error::pr_number input must be all decimal digits (received ${#PR_NUMBER} character(s) with non-decimal content)."
              exit 1
              ;;
          esac

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<< "$pr_json")"
          title="$(jq -r '.title' <<< "$pr_json")"
          body="$(jq -r '.body // ""' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          if [ "$state" != "open" ] || [ "$base_ref" != "main" ]; then
            echo "::error::Dispatched PR must be open and target main."
            exit 1
          fi
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Dispatched PR head $head_sha does not match workflow ref $GITHUB_SHA."
            exit 1
          fi
          if ! grep -Eq '^(feat|fix|perf|revert|docs|chore|refactor|test|ci|build)(\([^)]+\))?!?: .+' <<< "$title"; then
            echo "::error::PR title does not satisfy the conventional-title contract."
            exit 1
          fi

          summary_ln="$(grep -n -m1 '^## Summary[[:space:]]*$' <<< "$body" | cut -d: -f1 || true)"
          audit_ln="$(grep -n -m1 '^## Invariant audit[[:space:]]*$' <<< "$body" | cut -d: -f1 || true)"
          test_ln="$(grep -n -m1 '^## Test plan[[:space:]]*$' <<< "$body" | cut -d: -f1 || true)"
          if [ -z "$summary_ln" ] || [ -z "$audit_ln" ] || [ -z "$test_ln" ] || \
             [ "$summary_ln" -ge "$audit_ln" ] || [ "$audit_ln" -ge "$test_ln" ]; then
            echo "::error::PR body must contain Summary, Invariant audit, and Test plan in order."
            exit 1
          fi

          # Path classification is owned by scripts/user-visible-paths.ts
          # (issue #2955). Listing integrity (issue #3290): ONE paginated
          # snapshot feeds both lists — two back-to-back calls could describe
          # two different commits after a push between them. The snapshot's
          # completeness is proven against the PR's own changed_files count,
          # and the head guard from above is re-asserted AFTER the listing so
          # a push during the listing fails closed instead of classifying a
          # stale or partial change set. `--jq '.[]'` emits exactly one
          # compact JSON entry per line across all pages (jq terminates every
          # line, so wc -l counts entries exactly); the derived lists stay
          # JSON-encoded end to end, so a name containing a quote, backslash,
          # control character, or newline survives to the classifier instead
          # of corrupting a line-delimited transport.
          #
          # Renames contribute BOTH paths in the changed list, matching the
          # git-side --no-renames view (the rename-scoped previous_filename
          # guard matters: it is also populated for copied entries, where the
          # git side sees only the new path). The added set mirrors git's
          # `--diff-filter=A --find-renames=100%`: "added" and "copied"
          # count, an exact rename does NOT, and a rename WITH content edits
          # DOES (git reports that as A+D because only a 100%-similarity
          # rename is suppressed). Keying the rename branch on .changes > 0
          # is what keeps this arm in agreement with the pull_request arm and
          # the quality gate for every rename band.
          rc=0
          tmp_entries="$(mktemp)"
          tmp_changed="$(mktemp)"
          tmp_added="$(mktemp)"
          trap 'rm -f "${tmp_entries:-}" "${tmp_changed:-}" "${tmp_added:-}"' EXIT
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[]' > "$tmp_entries" || { echo "::error::files listing failed."; exit 1; }
          listed="$(wc -l < "$tmp_entries")"
          expected="$(jq -r '.changed_files' <<< "$pr_json")"
          # A non-integer count must fail closed: `[ x -ne y ]` with a
          # non-numeric operand returns 2, which an `if` treats as false —
          # the guard would be skipped exactly when it cannot prove safety.
          case "$expected" in
            ''|*[!0-9]*)
              echo "::error::Files listing completeness unverifiable: the PR reports a non-integer changed_files count."
              exit 1
              ;;
          esac
          if [ "$listed" -ne "$expected" ]; then
            echo "::error::Files listing incomplete: $listed entries listed but the PR reports $expected changed files — refusing to classify a truncated or partial listing."
            exit 1
          fi
          head_now="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$head_now" != "$GITHUB_SHA" ]; then
            echo "::error::PR head moved to $head_now while the listing was built (workflow ref $GITHUB_SHA) — refusing to classify a stale snapshot."
            exit 1
          fi
          jq -c '.filename, (select(.status == "renamed") | .previous_filename // empty)' "$tmp_entries" > "$tmp_changed"
          jq -c 'select(.status == "added" or .status == "copied" or (.status == "renamed" and .changes > 0)) | .filename' "$tmp_entries" > "$tmp_added"
          if [ ! -s "$tmp_changed" ]; then
            echo "::error::Dispatched PR has no changed files."
            exit 1
          fi

          verdict="$(bun scripts/check-pending-fragment.ts --print-requirement --paths-format jsonl --changed-file "$tmp_changed" --added-file "$tmp_added")" || rc=$?
          case "$rc" in
            0)
              ;;
            1)
              case "$verdict" in
                'required=true satisfied=false')
                  echo "::error::Dispatched PR is missing a pending release fragment."
                  ;;
                *)
                  echo "::error::Fragment classifier failed (exit 1, no violation verdict): ${verdict:-<no output>}"
                  ;;
              esac
              exit 1
              ;;
            *)
              echo "::error::Fragment classifier unusable (exit $rc): $verdict"
              exit 1
              ;;
          esac
          echo "Dispatched PR contract satisfied for #$PR_NUMBER."
