name: Stale

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 9am UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: 'Inactive for 30 days — will close in 7 days unless updated.'
          stale-pr-message: 'Inactive for 30 days — will close in 7 days unless updated.'
          close-issue-message: 'Closed due to inactivity.'
          close-pr-message: 'Closed due to inactivity.'
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
