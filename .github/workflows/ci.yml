name: CI

on:
  pull_request:
    branches: ["**"]
  # Required checks must also run for merge-queue merge groups, otherwise queued
  # PRs never receive their required check runs and the queue cannot merge them
  # (see issue #1046). Keep `pull_request` for early per-PR feedback.
  merge_group:
    types: [checks_requested]

# Serialize CI runs for the same branch/PR. Old runs are NOT cancelled because
# cancelling leaves stale check statuses that persist on PRs and block merging
# even after a new successful run completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fast (~5s) detection of release-please branches. Works for both PR events
  # (checks github.head_ref) and merge-queue events (checks commit messages
  # since github.head_ref is unavailable in merge groups).
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 10
      - name: Detect release-please
        id: check
        shell: bash
        run: |
          if [[ "$BRANCH" == release-please--* ]]; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Inspect ONLY the merge-group head commit (-1), not a window of
          # history. The queued merge commit is "Merge pull request #N from
          # <owner>/release-please--..." with the release commit "chore(main):
          # release X.Y.Z" in its body, so its full message (%B) identifies a
          # release merge. Two traps this avoids:
          #   1. The release commit is the merge commit's SECOND parent, so it
          #      is absent from the first-parent history the shallow merge-queue
          #      checkout traverses — the old "git log --max-count=10" grep for
          #      the release subject silently missed it and ran the full suite.
          #   2. A 10-commit window false-positives: a recent release MERGE
          #      ("Merge pull request ... release-please--...") lingers in the
          #      window of later, non-release PRs and would wrongly skip them.
          # HEAD-only is both robust (no traversal) and specific (this group).
          if [[ "$EVENT" == "merge_group" ]] && git log -1 --format='%B' | grep -qE 'release-please--|^chore\(main\): release'; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "is-release=false" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}

  # Issue #1737 FR-013: closes the root cause of the #1729 debt-accumulation
  # episode — pull_request CI ran ubuntu-only, so macOS/Windows-only failures
  # were invisible until a merge_group bounce. This job detects whether the PR
  # diff touches platform-sensitive paths and, if so, the `unit` job below
  # automatically runs the full 3-OS matrix on pull_request too (previously
  # only merge_group did). Modeled on the detect-release job above (fast,
  # single ubuntu-latest job producing a boolean output the matrix consumes).
  # No job-level `if:` here (unlike detect-release's own guard on its
  # checkout step, not itself) — matching the established quality/unit
  # pattern where downstream jobs never skip at the job level, only steps
  # skip individually. A job-level `if:` here would report this job as
  # "skipped" (not "success") on release-please branches, and by default
  # `needs:` treats a skipped dependency as not-satisfied, which would
  # cascade to skip the entire `unit` job on every release branch — release
  # branches would then never even report the required `unit (*, N)` checks.
  detect-paths:
    needs: [detect-release]
    runs-on: ubuntu-latest
    outputs:
      touches-platform-paths: ${{ steps.check.outputs.touches-platform-paths }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          # Full history needed so both BASE_SHA and HEAD_SHA below are
          # guaranteed present locally for a plain two-dot `git diff` (a
          # shallow clone can miss one of them, especially BASE_SHA on a
          # long-lived PR). Two-dot, not three-dot/merge-base: this only
          # needs "what changed between these two exact commits," and
          # two-dot's tendency to also include unrelated upstream churn is
          # the safe-direction failure mode here — it can only make this
          # detector MORE likely to opt into the fuller matrix, never less.
          # Matches drift-check.yml's fetch-depth: 0 convention.
          fetch-depth: 0
      # Single unconditional step (not split by event type) so the job-level
      # `outputs:` above always resolves from this one step's ID, regardless
      # of event — a prior split-step version left `steps.check` unset (and
      # the job output empty) on non-pull_request events, since a step whose
      # own `if:` is false produces no outputs at all, not empty-string ones.
      - name: Detect platform-sensitive path changes
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Only pull_request has a meaningful base...head diff to inspect
          # here; merge_group already gets the full 3-OS matrix unconditionally
          # via the separate github.event_name == 'merge_group' branch in the
          # unit job's matrix expression, so this output doesn't need to (and
          # can't, without a PR base/head pair) do anything for that event.
          if [ "$EVENT" != "pull_request" ]; then
            echo "touches-platform-paths=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Platform-sensitive: worktree/sandbox/plan isolation logic, the lean
          # turbo runner (where issue #1737's A1 macOS-only bug lives),
          # src/parallel (lock-directory creation / EACCES semantics — the
          # confirmed root cause of A2a's read-only-.swarm cross-platform
          # bug, added after a test-engineer review caught it missing from
          # the original 5-prefix list), src/knowledge (cohort-identity git
          # rev-parse / realpath canonicalization — issue #1846's git-common-dir
          # worktree convergence bug was Windows-only under Bun and slipped
          # through ubuntu-only PR CI to fail in the merge queue on PR #1851),
          # src/tools (tool filesystem behavior, including Windows junction
          # containment), CI scripts, and the workflow files
          # themselves. Piped directly rather than captured into a variable
          # first. Deliberately grep -E redirected to /dev/null below, and
          # NOT grep -q: under set -o pipefail, grep -q exits as soon as it
          # sees the first match and closes its stdin, which can send
          # SIGPIPE to a still-writing git diff upstream on a large diff —
          # pipefail then reports that SIGPIPE (128+13=141) as the
          # pipeline's exit status, making this if silently false even
          # though a match occurred (the unsafe direction — it would drop
          # platform-path PRs to the ubuntu-only matrix). grep without -q
          # or -m reads its input to EOF before exiting, so git diff always
          # finishes writing normally and no SIGPIPE is possible.
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null | grep -E '^(src/worktree/|src/turbo/|src/sandbox/|src/plan/|src/parallel/|src/knowledge/|src/memory/|src/tools/|scripts/|\.github/workflows/)' >/dev/null; then
            echo "touches-platform-paths=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches-platform-paths=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: [detect-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: needs.detect-release.outputs.is-release != 'true'
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      - name: Type check
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run typecheck
      - name: Biome CI
        if: needs.detect-release.outputs.is-release != 'true'
        run: bunx biome ci .
      - name: Mock isolation compliance check
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: chmod +x scripts/check-mock-cleanup.sh && bash scripts/check-mock-cleanup.sh
      - name: Engineering invariant checks
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: chmod +x scripts/check-invariants.sh && bash scripts/check-invariants.sh
      - name: Tool registration coherence check
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run scripts/check-tool-registration.ts
      # Issue #2063 E2: baseline-ratcheted guard against runtime-surfaced
      # agent guidance (thrown gate errors, advisories, agent prompts, shipped
      # skills) referencing src/ paths absent from an installed deployment.
      - name: Runtime src/ reference ratchet (issue #2063)
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run check:runtime-src-refs
      # Blocking gate for issue #2029 AC6: a new event type is not complete
      # until it has a catalog entry, producer, consumer/retention owner,
      # privacy class, tests, and documentation. Hard-fail, no enforce/warn
      # env var (unlike drift-check, which is soft-warn by default).
      - name: Event contract check (issue #2029 AC6)
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run check:events
      - name: Retention registry check (issue #2036 gate)
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run check:retention
      - name: Cross-contamination check (mock.module / vi.mock leaks)
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: chmod +x scripts/check-cross-contamination.sh && bash scripts/check-cross-contamination.sh
      # Line-scoped: fails only on lines ADDED by the diff that introduce a
      # raw-clock pattern in a test that doesn't reference the freezeClock
      # helper. Merely touching a file that already violates stays a
      # non-blocking warning, as do files outside the diff
      # (issue #1782 root-cause class 1 prevention).
      - name: Test-clock lint (freezeClock adoption)
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: chmod +x scripts/check-test-clock.sh && bash scripts/check-test-clock.sh
      # Diff-scoped ratchet (FR-006): fails only on NEW test files over 500
      # lines or existing over-cap files that grew. Pre-existing violators
      # are non-blocking. Escape hatch: TEST_CAP_ENFORCE=0 soft-warns.
      # (issue #1781 E1). Ported to TypeScript in issue #2078 so Windows
      # contributors can run the identical gate locally with
      # `bun run check:test-file-cap` — no Bash required.
      - name: Test file line-cap ratchet (FR-006)
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run check:test-file-cap
      # Issue #2078 recurrence guardrail: a NEW Bash-only gate wired into any
      # workflow is blocked, because Windows contributors cannot run it
      # locally. Existing Bash gates are baselined in
      # scripts/gate-portability-baseline.json; porting one must remove its
      # entry (stale entries also fail).
      - name: CI gate portability ratchet (issue #2078)
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run check:gate-portability
      # Issue #2236 (F8b) recurrence guardrail: a call to the spawn family
      # (spawnSync/spawn/execFile/execFileSync/exec/bunSpawn/runExternalTool)
      # must not spawn a bare 'git'/'gh'/'sandbox-exec'/'bwrap' literal —
      # every such executable must be resolved to an absolute path first
      # (src/utils/git-executable.ts is the sole allowlisted resolver
      # module). Hard-fail, zero exemptions outside the resolver.
      - name: Bare-executable-spawn ratchet (issue #2236)
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run check:bare-spawn
      # Line-scoped (not file-scoped): fails only on NEW/changed lines that add
      # a raw tmpdir() call not wrapped in realpathSync. Pre-existing raw calls
      # elsewhere in a touched file are not flagged (issue #1737 FR-011 scope
      # decision — retrofitting the ~250 pre-existing occurrences is out of
      # scope). Prefer tests/helpers/tmpdir.ts (canonicalTmpDir/canonicalMkdtemp).
      - name: Test tmpdir canonicalization lint (FR-011)
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: chmod +x scripts/check-test-tmpdir.sh && bash scripts/check-test-tmpdir.sh
      # Not diff-scoped (unlike the sibling checks above): a bash4+-only
      # construct is exactly as broken on macOS as it was the day it was
      # added, so this scans full current file content in scripts/, not just
      # the diff (issue #1737 FR-012 — prevents recurrence of the
      # check-invariants.sh `declare -A` incident, issue #1729).
      - name: Bash portability lint (FR-012)
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: chmod +x scripts/check-bash-portability.sh && bash scripts/check-bash-portability.sh

      # Standalone helper under scripts/swarm-model/ has its own node:test suite
      # (not part of the src/**/*.test.ts glob the unit job discovers). Run it
      # here so the utility's regression tests are actually gated in CI.
      - name: swarm-model CLI tests
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: cd scripts/swarm-model && node --test

  # Issue #1466 (Phase 6, item 9): embedding-drift regression gate. Runs the
  # golden memory-recall evaluation against the pinned baseline
  # (tests/fixtures/memory-recall-baseline.json) and fails when precision@k
  # drops more than 0.05. The script also runs the harness twice and fails on
  # nondeterministic metrics, so a flaky fixture cannot silently pass. Runs on
  # bun directly from source (no build needed). Making this a REQUIRED check
  # is a branch-protection setting owned by the maintainers — the job itself
  # is blocking within this workflow (pull_request + merge_group triggers).
  memory-recall-regression:
    needs: [detect-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: needs.detect-release.outputs.is-release != 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      - name: Memory recall regression gate
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run check:memory-recall

  # Two-tier CI: on pull_request, run ubuntu-only with 4 shards for fast feedback
  # UNLESS the diff touches a platform-sensitive path (issue #1737 FR-013,
  # detect-paths job above), in which case the full 3-OS matrix runs on
  # pull_request too. On merge_group (merge queue), the full 3-OS matrix
  # always runs for merge safety. On release-please branches, all steps are
  # skipped via detect-release job (version bumps don't need tests — applies
  # to both PR and merge-queue tiers). Test files are discovered automatically
  # via find and distributed round-robin across shards — no hardcoded file
  # lists, no duplication.
  unit:
    needs: [detect-release, quality, detect-paths]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'merge_group' || needs.detect-paths.outputs.touches-platform-paths == 'true') && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    # 40m: was 90m before sharding (PR #1245). Issue #1778 H4 wired the
    # previously-orphaned src/** + tests/adversarial trees into this job (~1666
    # files total), so shards went 4→6 to keep per-shard file counts (~278) at or
    # below the prior 4-shard level (~342). Per-shard runtime stays ~7-15 min on
    # ubuntu/macOS and ~20-25 min on Windows (4-7× slower runners). 40m headroom.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: needs.detect-release.outputs.is-release != 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        id: cache-bun
        if: needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
            ${{ runner.os }}-bun
      - name: Install dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      # dist/ is generated output and no longer committed (#1047); build it so the
      # tests under tests/unit/build/ that load the bundle have a dist/ to read.
      - name: Build
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run build
      - name: Collect and partition test files
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          tmpdir="${RUNNER_TEMP:-${TEMP:-/tmp}}"
          # Run the previously-orphaned test trees too (issue #1778 H4): src/**,
          # tests/adversarial, and the other never-gated dirs. tests/integration,
          # tests/security, tests/smoke, and top-level test/ are intentionally
          # EXCLUDED — they are owned by the integration/security/smoke jobs.
          {
            find src -name '*.test.ts' -type f
            find tests/unit tests/adversarial tests/architect tests/cli tests/tools tests/helpers -name '*.test.ts' -type f 2>/dev/null
            find tests -maxdepth 1 -name '*.test.ts' -type f 2>/dev/null
          } | sort -u > "$tmpdir/all-tests.txt"
          # Drop known-red pre-existing failures (issue #1705) so the gate reflects
          # new regressions, not the debt backlog CI's old broken detection had been
          # silently hiding. See scripts/ci/quarantined-tests.txt for the tracked list.
          grep -vE '^\s*#|^\s*$' scripts/ci/quarantined-tests.txt > "$tmpdir/quarantined-raw.txt" || true
          # RUNNER_OS is a GitHub Actions default env var (Linux/Windows/macOS).
          # merge_group runs the full 3-OS matrix; some pre-existing failures
          # only reproduce on one non-Linux OS (see scripts/ci/quarantined-tests-{macos,windows}.txt).
          if [ "$RUNNER_OS" = "macOS" ] && [ -f scripts/ci/quarantined-tests-macos.txt ]; then
            grep -vE '^\s*#|^\s*$' scripts/ci/quarantined-tests-macos.txt >> "$tmpdir/quarantined-raw.txt" || true
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -f scripts/ci/quarantined-tests-windows.txt ]; then
            grep -vE '^\s*#|^\s*$' scripts/ci/quarantined-tests-windows.txt >> "$tmpdir/quarantined-raw.txt" || true
          fi
          sort -u "$tmpdir/quarantined-raw.txt" > "$tmpdir/quarantined.txt"
          comm -23 "$tmpdir/all-tests.txt" "$tmpdir/quarantined.txt" > "$tmpdir/gated-tests.txt"
          num_shards=6
          awk -v s="$SHARD" -v n="$num_shards" '(NR - 1) % n == (s - 1)' "$tmpdir/gated-tests.txt" > "$tmpdir/shard-tests.txt"
          if [ ! -s "$tmpdir/shard-tests.txt" ]; then
            echo "::error::No test files found for shard ${SHARD}"
            exit 1
          fi
          # Avoid dollar-paren command substitution here: this workflow's own
          # security scan (tests/security/ci-workflow-security.test.ts) flags
          # that syntax inside a run: step as a command-injection risk pattern.
          wc -l < "$tmpdir/quarantined.txt" > "$tmpdir/quarantined-count.txt"
          read -r quarantined_count < "$tmpdir/quarantined-count.txt"
          echo "Shard ${SHARD}/${num_shards} (${quarantined_count} file(s) quarantined repo-wide, issue #1705)"
      - name: Run unit tests
        if: needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: |
          failed=0
          tmpdir="${RUNNER_TEMP:-${TEMP:-/tmp}}"
          trap 'rm -f "$tmpdir"/bun-out-$$-*' EXIT
          # flake-annotations.txt captures retry-flake + hard-failure signals so
          # the downstream flake-detection workflow_run can suggest quarantines
          # (issue #1782). Written to a workspace-relative path (survives the
          # tmpdir trap cleanup) and uploaded if-always below.
          flake_ann="flake-annotations-unit-shard-$SHARD.txt"
          : > "$flake_ann"
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            tmp="$tmpdir/bun-out-$$-${f##*/}"
            exit_code=0
            # No --coverage here: per-file coverage is overwritten each invocation
            # and never aggregated. The coverage gate (the dedicated coverage job)
            # owns the full-suite measurement; instrumenting every sharded test
            # process was pure overhead on every cell.
            bun scripts/ci/run-test-with-timeout.ts "$f" --timeout 120000 --kill-timeout 180 > "$tmp" 2>&1 || exit_code=$?
            # Real GH Actions runs (not reproducible standalone locally, even
            # under simulated CPU load) have shown a low baseline of
            # single-shard flakes under the shared runners' resource
            # contention — a different file each run, always passing
            # standalone. Two retries (three attempts total) before treating a
            # failure as real; issue #1705 tracks anything that needs more.
            max_retries=2
            retry_num=0
            while [ $exit_code -ne 0 ] && [ $retry_num -lt $max_retries ]; do
              let retry_num+=1
              echo "::warning file=$f::Attempt $retry_num failed, retrying ($retry_num/$max_retries): $f"
              exit_code=0
              bun scripts/ci/run-test-with-timeout.ts "$f" --timeout 120000 --kill-timeout 180 > "$tmp" 2>&1 || exit_code=$?
              if [ $exit_code -eq 0 ]; then
                echo "::notice file=$f::Passed on retry $retry_num (flaky): $f"
                echo "::notice file=$f::Passed on retry $retry_num (flaky): $f" >> "$flake_ann"
              fi
            done
            if [ $exit_code -ne 0 ]; then
              # Informational only — bun 1.3.x's failure markers don't reliably
              # match this pattern, so it must not gate pass/fail. exit_code is
              # the sole failure signal.
              grep -qE "^[[:space:]]*(FAIL|✗|AssertionError|\[TIMEOUT\])" "$tmp" || true
              # Print the captured output so the actual assertion failure is
              # visible in the log — the grep above only computes a match and
              # never printed it, and the temp file is deleted at step end
              # (trap below), so previously every failure showed only a bare
              # "FAILED: <path>" with no diagnostic content at all.
              echo "::group::Output for $f"
              cat "$tmp"
              echo "::endgroup::"
              echo "::error file=$f::FAILED: $f"
              echo "::error file=$f::FAILED: $f" >> "$flake_ann"
              failed=1
            fi
            # Surface timing and timeout info to CI output (not just temp file)
            grep -E "^\[TIMING\]|^\[TIMEOUT\]" "$tmp" || true
            rm -f "$tmp"
          done < "$tmpdir/shard-tests.txt"
          exit $failed
      # Upload the per-shard flake-annotations file `if: always()` so the
      # downstream flake-detection workflow_run can download it and suggest
      # quarantines even when this job failed (issue #1782). if-no-files-found:
      # ignore — an empty annotation file (no flakes/failures) is normal.
      - name: Upload flake annotations
        if: always() && needs.detect-release.outputs.is-release != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-annotations-unit-shard-${{ matrix.shard }}
          path: flake-annotations-unit-shard-*.txt
          if-no-files-found: ignore
      # NOTE: the coverage gate used to run here as an extra step on
      # `unit (ubuntu-latest, 1)`, which made that one cell execute the entire
      # unit suite twice (sharded run + full-suite coverage run) inside the 40m
      # budget — ~30-35 min in practice, intermittently timing out and blocking
      # the merge queue (PR #1573). It now lives in the dedicated `coverage` job
      # below so the full-suite run gets its own timeout and the unit cells stay
      # fast. `coverage` is already enforced: it's a required status check in
      # branch-protection ruleset 17809658 (confirmed active — issue #1737
      # FR-014, correcting this comment, which previously and incorrectly
      # described enforcement as still-pending).

  # Issue #1737 FR-013: aggregate job so branch-protection ruleset 17809658 can
  # require a single stable check name regardless of which OS cells the
  # path-scoped conditional matrix above actually ran for a given PR — a
  # per-cell required check (e.g. "unit (macos-latest, 1)") would never
  # report at all on a PR where detect-paths decided macOS/Windows weren't
  # needed, permanently blocking the merge queue for that PR. always() so this
  # still runs (and can fail) even if a `unit` matrix cell failed upstream.
  unit-passed:
    needs: [unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check unit job result
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          if [ "$UNIT_RESULT" != "success" ]; then
            echo "::error::unit job result was '$UNIT_RESULT', not 'success'"
            exit 1
          fi
          echo "All unit matrix cells that ran succeeded."

  # Merge-queue-only coverage gate. Runs the full unit suite once with coverage
  # and enforces the line-coverage threshold. Isolated from the `unit` job so the
  # inherently ~26-31 min full-suite coverage measurement gets its own generous
  # timeout instead of stacking onto a sharded unit cell's 40m budget (see the
  # NOTE in the `unit` job above and PR #1573). On pull_request all steps are
  # skipped and the job reports success to satisfy the required check without
  # doing work (same pattern as integration/smoke). Skipped for release-please
  # branches (version bumps don't change coverage).
  coverage:
    needs: [detect-release, quality]
    runs-on: ubuntu-latest
    # Coverage is the merge-group long pole: clean runs for PR #2290 took about
    # 45 minutes. It must start after `quality`, in parallel with the unit matrix,
    # so the required result arrives within ruleset 17809658's 60-minute
    # check_response_timeout_minutes. Serializing it behind `unit` produced
    # 63-minute merge-group runs; GitHub evicted them 26-43 seconds before the
    # successful coverage result arrived (CI-004).
    #
    # A failing unit shard no longer cancels this independent job early, which
    # may spend extra runner time on an already-blocked merge group. Correctness
    # is unchanged: both unit checks and coverage remain required, while the
    # parallel graph keeps successful groups inside the queue deadline. On
    # pull_request, coverage's steps remain gated on `merge_group` and report
    # success without doing work.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      # The full suite includes tests/unit/build/ tests that load the bundle, so
      # dist/ must exist (matches the unit job's rationale).
      - name: Build
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun run build
      - name: Coverage gate enforcement
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: |
          set -e
          echo "Running coverage measurement for gate enforcement..."
          # Run each file in its own coverage process so file-scoped mocks and
          # runtime state cannot contaminate later files in the merge-queue
          # coverage gate (issue #1712). The helper merges the per-file lcov
          # records before enforcing the threshold, so the gate still measures
          # the full non-quarantined suite rather than a single shard.
          bash scripts/ci/run-coverage-gate.sh
      - name: Upload coverage report
        if: always() && github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage-output.txt
            coverage/lcov.info
          if-no-files-found: warn
      # Upload the coverage job's flake-annotations file `if: always()` so the
      # downstream flake-detection workflow_run can pick it up alongside the
      # unit shards' annotations (issue #1782). run-coverage-gate.sh always
      # creates flake-annotations-coverage.txt unconditionally (`: >`), even
      # on a clean run with no retries/failures, so this step normally always
      # has a file to upload (a 0-byte one on a clean run). if-no-files-found:
      # ignore is not about the skipped case — a step whose `if:` is false
      # never evaluates the setting at all. It covers the case where the file
      # was never created. The two upload steps are the only ones in this job
      # carrying `always()`, so they still run when an earlier step failed:
      # if install / build / the gate step itself fails, the script never
      # executes and never creates the file (the common case), and likewise
      # if the script aborts under `set -euo pipefail` before creating it.
      # Neither must fail the job over a missing artifact.
      - name: Upload coverage flake annotations
        if: always() && github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-annotations-coverage
          path: flake-annotations-coverage.txt
          if-no-files-found: ignore

  # Merge-queue-only: on pull_request all steps are skipped, job reports success
  # to satisfy required checks without doing work. Also skipped for release-please.
  integration:
    needs: [detect-release, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      - name: Integration tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: |
          failed=0
          tmpdir="${RUNNER_TEMP:-${TEMP:-/tmp}}"
          trap 'rm -f "$tmpdir"/bun-out-int-* "$tmpdir"/int-*.txt' EXIT
          find tests/integration test -maxdepth 1 -name '*.test.ts' -type f | sort > "$tmpdir/int-all-tests.txt"
          # Drop known-red pre-existing failures (issue #1705) — same rationale
          # as the unit/coverage jobs' quarantine lists. See
          # scripts/ci/quarantined-integration-tests.txt for the tracked list.
          grep -vE '^\s*#|^\s*$' scripts/ci/quarantined-integration-tests.txt | sort > "$tmpdir/int-quarantined.txt" || true
          comm -23 "$tmpdir/int-all-tests.txt" "$tmpdir/int-quarantined.txt" > "$tmpdir/int-gated-tests.txt"
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            tmp="$tmpdir/bun-out-int-$$-${f##*/}"
            exit_code=0
            bun --smol test "$f" --timeout 120000 > "$tmp" 2>&1 || exit_code=$?
            # Real GH Actions runs have shown a handful of files that pass
            # standalone locally (even under simulated CPU load) but fail
            # intermittently on the shared runners (matches the unit job's
            # per-shard flake pattern). Two retries (three attempts total)
            # before treating a failure as real.
            max_retries=2
            retry_num=0
            while [ $exit_code -ne 0 ] && [ $retry_num -lt $max_retries ]; do
              let retry_num+=1
              echo "::warning file=$f::Attempt $retry_num failed, retrying ($retry_num/$max_retries): $f"
              exit_code=0
              bun --smol test "$f" --timeout 120000 > "$tmp" 2>&1 || exit_code=$?
              if [ $exit_code -eq 0 ]; then
                echo "::notice file=$f::Passed on retry $retry_num (flaky): $f"
              fi
            done
            if [ $exit_code -ne 0 ]; then
              # Informational only — bun 1.3.x's failure markers don't reliably
              # match this pattern, so it must not gate pass/fail. exit_code is
              # the sole failure signal.
              grep -qE "^[[:space:]]*(FAIL|✗|AssertionError)" "$tmp" || true
              echo "::group::Output for $f"
              cat "$tmp"
              echo "::endgroup::"
              echo "::error file=$f::FAILED: $f"
              failed=1
            fi
            rm -f "$tmp"
          done < "$tmpdir/int-gated-tests.txt"
          exit $failed

  # Release-please PRs skip package-check (version bumps don't change the bundle).
  package-check:
    needs: [detect-release, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: needs.detect-release.outputs.is-release != 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: needs.detect-release.outputs.is-release != 'true'
        with:
          node-version: "22"
      - name: Cache bun dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      - name: Build
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run build
      - name: Validate packed npm artifact
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun run package:smoke

  # Release-please PRs skip security tests (version bumps don't affect security).
  security:
    needs: [detect-release, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: needs.detect-release.outputs.is-release != 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      - name: Security tests
        if: needs.detect-release.outputs.is-release != 'true'
        run: bun test tests/security --timeout 120000

  # Merge-queue-only: on pull_request all steps are skipped, job reports success.
  php-validation:
    needs: [detect-release, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        with:
          php-version: "8.2"
          tools: composer
          coverage: none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      - name: PHP profile command surface tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun --smol test tests/unit/lang/profiles-php.test.ts --timeout 60000
      - name: PHP framework detection and command overlay tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun --smol test tests/unit/lang/framework-detector.test.ts --timeout 60000
      - name: PHP Composer ecosystem discovery tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun --smol test tests/unit/build/discovery-php.test.ts --timeout 60000
      - name: Composer audit handler tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun --smol test tests/unit/tools/pkg-audit-composer.test.ts --timeout 60000
      - name: Laravel SAST rule tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun --smol test tests/unit/tools/sast-scan-laravel.test.ts --timeout 60000
      - name: Laravel fixture detection and SAST coverage tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun --smol test tests/unit/lang/laravel-fixture.test.ts --timeout 60000

  # Merge-queue-only: on pull_request all steps are skipped, job reports success.
  rust-sandbox-runner:
    needs: [detect-release]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runners/swarm-sandbox-runner/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runners/swarm-sandbox-runner/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        working-directory: runners/swarm-sandbox-runner
        run: cargo fmt --check
      - name: Clippy lint
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        working-directory: runners/swarm-sandbox-runner
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        working-directory: runners/swarm-sandbox-runner
        run: cargo test --all-targets
      - name: Build release binary
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        working-directory: runners/swarm-sandbox-runner
        run: cargo build --release
      - name: Probe smoke test
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        working-directory: runners/swarm-sandbox-runner
        run: ./target/release/swarm-sandbox-runner.exe --probe

  # Merge-queue-only: on pull_request all steps are skipped, job reports success.
  smoke:
    needs: [detect-release, unit, integration, package-check, php-validation, rust-sandbox-runner]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        with:
          bun-version: "1.3.13"
      - name: Cache bun dependencies
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun install --frozen-lockfile
      - name: Build package
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun run build
      - name: Smoke tests
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        run: bun test tests/smoke --timeout 120000
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # Pin a Node with flag-free node:sqlite (22.13+) for the #1873 repro below,
        # which drives the DB layer under Node via the node:sqlite fallback. Matches
        # the node-version used by the package-check job.
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        with:
          node-version: "22"
      - name: Issue #704 repro — Desktop init under Node
        # Loads the compiled dist/ under Node (the runtime OpenCode Desktop's
        # sidecar uses on macOS) and asserts the plugin's `server()` resolves
        # within 10s. Pre-fix this would hang. Runs on Linux, macOS, Windows
        # so the cycle/cap/budget guards are exercised on each OS.
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: node scripts/repro-704.mjs
      - name: Issue #1873 repro — SQLite under Node
        # Drives the REAL project DB, global DB, and SQLite memory provider under
        # Node (no bun:sqlite) via the node:sqlite adapter. Pre-fix this threw
        # "Cannot find module 'bun:sqlite'" from every SQLite-backed tool. Runs on
        # Linux, macOS, Windows. `bun run` builds the harness entry, `node` runs it.
        if: github.event_name == 'merge_group' && needs.detect-release.outputs.is-release != 'true'
        shell: bash
        run: bun run repro:1873
