name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: latest
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify publishable manifests (fail closed on workspace specs or stale pins)
        run: node scripts/check-publish-manifests.mjs
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        # Dist-dependent tests need packages/*/dist built on every OS shard
        # before the Test step runs (PR #3163 feedback FB-002)
        run: bun run build
      - name: Test
        # Per-scope invocations: each scope runs in its own process so module-level
        # state cannot leak across suites (whole-tree single-process runs manufacture
        # cross-suite failures). Scope note: the abandoned monorepo migration left
        # pre-existing failures in packages/core/tests beyond utils, packages/claude-code,
        # and the 7.x-layout root tests/ tree - those are tracked for migration in #3160
        # and are excluded here (measured at base; not caused by this PR).
        run: |
          bun test packages/opencode/tests --timeout 120000
          bun test packages/core/tests/utils --timeout 120000
          bun test packages/telemetry --timeout 120000
          bun test tests/smoke tests/security/ci-workflow-security.runner.test.ts --timeout 120000
